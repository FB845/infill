# Static hosting of the Infill map (no build step). The local server (scripts/serve.py)
# adds Claude call sheets and live lot checks; the hosted page falls back without them.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Nothing private is in the repo (.env, raw/, pipeline.json are git-ignored), but keep
# tooling folders off the public site anyway.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/video/*"
  to = "/404.html"
  status = 404
  force = true
